[project]
name = "storylm"
version = "26.0.0"
description = "A small GPT-style language model built and trained from scratch"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "einops>=0.8",      # tensor operations
    "einx>=0.4",        # more general tensor operations
    "jaxtyping>=0.3",   # type hints for pytorch/jax/numpy
    "numpy>=2.4",
    "psutil>=7",
    "pytest>=9.0",
    "pytest-timeout",
    "regex>=2026.3.32", # more powerful regex than the builtin `re` module
    "tiktoken>=0.12.0",
    "torch~=2.11.0",
    "tqdm>=4.67",
    "wandb>=0.25",
    "ty>=0.0.26",
    "ruff>=0.15.8",
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "storylm"
module-root = ""

[tool.uv]
package = true
python-preference = "managed"

[tool.uv.sources]
# Windows (GTX 1050 Ti / Pascal): PyPI default builds dropped Pascal kernels
# since torch 2.8; this cu126 wheel (Aliyun mirror) still ships them.
# The Aliyun pytorch-wheels page is not a PEP 503 index, so pin by direct URL.
# Linux (server) keeps PyPI. Remember to bump this URL when upgrading torch.
torch = [
  { url = "https://mirrors.aliyun.com/pytorch-wheels/cu126/torch-2.11.0%2Bcu126-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32' and python_full_version < '3.13'" },
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"

[tool.ruff]
line-length = 120

[tool.ruff.lint.extend-per-file-ignores]
# Also ignore `E402` in all `__init__.py` files.
"__init__.py" = ["E402", "F401", "F403", "E501"]

[tool.ruff.lint]
extend-select = ["UP"]
ignore = ["F722"]
